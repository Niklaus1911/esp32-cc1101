name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Nothing reads these, so they never need a run. Tag pushes ignore path filters.
    paths-ignore: ["release-notes/**", "plan/**"]
  pull_request:
    paths-ignore: ["release-notes/**", "plan/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes an unfinished run. Tag runs
# publish a release and are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Documentation-only changes skip the ESP-IDF builds; host tests still check the README
  # and AGENTS.md contracts. Runs on a free GitHub-hosted runner (public repository).
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          firmware=true
          if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_EVENT_NAME" != workflow_dispatch &&
                -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            printf 'Changed files:\n%s\n' "$changed"
            if [[ -n "$changed" ]] &&
               ! grep -qvE '(\.md$|^docs/|^plan/|^release-notes/|^LICENSE)' <<<"$changed"; then
              firmware=false
            fi
          fi
          echo "firmware=$firmware" | tee -a "$GITHUB_OUTPUT"

  # The tagged commit already passed these on main, and they don't depend on the version.
  host-tests:
    name: Host tests
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install host toolchain
        run: |
          if ! command -v cmake >/dev/null || ! command -v g++ >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake g++ make
          fi
          cmake --version
          g++ --version

      # Native toolchain only: host tests must not see the ESP-IDF cross environment.
      - name: Build host tests
        run: |
          cmake -S host_tests -B build-host
          cmake --build build-host -j "$(nproc)"

      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure

  production:
    name: Production firmware (4 profiles)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 45
    container: espressif/idf:v6.0.2
    env:
      # ESP-IDF leaves ccache off by default. CCACHE_DIR is set per step because the
      # workspace path inside the container is only known at run time.
      IDF_CCACHE_ENABLE: "1"
      # Identify the compiler by content: a freshly unpacked container can give the
      # toolchain new timestamps on every run, which made every lookup miss.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: ESP-IDF derives the firmware version from `git describe`.
          fetch-depth: 0

      - name: Install image inspection tools and ccache
        run: |
          missing=()
          command -v objdump >/dev/null || missing+=(binutils)
          command -v ccache >/dev/null || missing+=(ccache)
          if (( ${#missing[@]} )); then
            apt-get update
            apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Check ESP-IDF version
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py --version | tee /dev/stderr | grep -q 'v6\.0\.2'

      # Compiler output only; ccache never changes the produced objects. Pull requests
      # restore the latest main cache but only main saves, so branches can't evict it.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-production-${{ github.sha }}
          restore-keys: ccache-production-

      - name: Verify production builds
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats
          RFBRIDGE_IDF_EXPORT="$IDF_PATH/export.sh" tools/verify-production.sh
          ccache --show-stats --verbose

      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-production-${{ github.sha }}

      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/esp32-cc1101-production/*/build/esp32-cc1101.bin
            /tmp/esp32-cc1101-production/*/build/esp32-cc1101.elf
            /tmp/esp32-cc1101-production/*/build/bootloader/bootloader.bin
            /tmp/esp32-cc1101-production/*/build/partition_table/partition-table.bin
            /tmp/esp32-cc1101-production/*/build/ota_data_initial.bin
            /tmp/esp32-cc1101-production/*/build/flash_args
            /tmp/esp32-cc1101-production/*/logs/

      # Package the images this job just verified (licenses and downloaded components are
      # available here, inside the ESP-IDF container). Every run exercises packaging; on
      # tags the images must report the tag as their version, and only tags publish.
      - name: Package release assets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["project_version"])' \
              /tmp/esp32-cc1101-production/esp32-devkit/build/project_description.json)"
          fi
          tools/package-release.sh "$version" /tmp/esp32-cc1101-production release-assets

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  unity:
    name: Unity image (${{ matrix.target }})
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.firmware == 'true'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 30
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install ccache
        run: command -v ccache >/dev/null || { apt-get update && apt-get install -y --no-install-recommends ccache; }

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-unity-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-unity-${{ matrix.target }}-

      # Compile only: on-device Unity tests need hardware and explicit approval.
      - name: Build Unity image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats
          source "$IDF_PATH/export.sh" >/dev/null
          build="/tmp/esp32-cc1101-unit-${{ matrix.target }}"
          idf.py -C test_apps/unit -B "$build" \
            -DIDF_TARGET=${{ matrix.target }} \
            -DSDKCONFIG="$build/sdkconfig" \
            -DSDKCONFIG_DEFAULTS="$PWD/test_apps/unit/sdkconfig.defaults;$PWD/test_apps/unit/sdkconfig.defaults.${{ matrix.target }}" \
            -DDEPENDENCIES_LOCK="$PWD/test_apps/unit/dependencies.lock.${{ matrix.target }}" \
            build
          ccache --show-stats --verbose

      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-unity-${{ matrix.target }}-${{ github.sha }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    # Tag images must be rebuilt so they report the tag as their version; the tests and
    # Unity builds already passed on main for the same source.
    needs: production
    # Publishing only needs the gh CLI, which GitHub-hosted runners always provide.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing $notes; commit release notes before tagging." >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "RFBridge $GITHUB_REF_NAME" \
            --notes-file "$notes" release-assets/*
